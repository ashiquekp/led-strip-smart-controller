name: lumora
description: A professional Flutter + IoT smart LED strip controller.

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # ----------------------------
  # State Management
  # ----------------------------
  flutter_riverpod: ^3.0.3
  riverpod_annotation: ^3.0.3

  # ----------------------------
  # Routing
  # ----------------------------
  go_router: ^16.2.0

  # ----------------------------
  # MQTT
  # ----------------------------
  mqtt_client: ^10.11.1

  # ----------------------------
  # Theme
  # ----------------------------
  flex_color_scheme: ^8.3.0
  google_fonts: ^6.3.1

  # ----------------------------
  # Models
  # ----------------------------
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # ----------------------------
  # Local Storage
  # ----------------------------
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # ----------------------------
  # Utilities
  # ----------------------------
  intl: ^0.20.2
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  build_runner: ^2.7.1

  riverpod_generator: ^3.0.3

  freezed: ^3.2.3

  json_serializable: ^6.11.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/